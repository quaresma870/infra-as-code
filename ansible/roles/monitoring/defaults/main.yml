---
# 'monitoring_' prefix added for ansible-lint idiom compliance (var-naming).
# The old, unprefixed names below still work as a fallback for any
# existing inventory that hasn't been updated to the new names yet.
monitoring_node_exporter_version: "{{ node_exporter_version | default('1.8.2') }}"
monitoring_node_exporter_port: "{{ node_exporter_port | default(9100) }}"
monitoring_subnet: any
