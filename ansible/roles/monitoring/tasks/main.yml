---
# ── Monitoring role — Prometheus Node Exporter ────────────────────────────────

- name: Create node_exporter user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /bin/false
    home: /var/lib/node_exporter
    create_home: false

- name: Check if node_exporter is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/node_exporter
  register: node_exporter_binary

- name: Download node_exporter
  ansible.builtin.get_url:
    url: >
      https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/
      node_exporter-{{ node_exporter_version }}.linux-{{ ansible_architecture | replace('x86_64','amd64') | replace('aarch64','arm64') }}.tar.gz
    dest: /tmp/node_exporter.tar.gz
    mode: "0644"
  when: not node_exporter_binary.stat.exists

- name: Extract node_exporter
  ansible.builtin.unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /tmp
    remote_src: true
  when: not node_exporter_binary.stat.exists

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: /tmp/node_exporter-{{ node_exporter_version }}.linux-{{ ansible_architecture | replace('x86_64','amd64') | replace('aarch64','arm64') }}/node_exporter
    dest: /usr/local/bin/node_exporter
    owner: node_exporter
    group: node_exporter
    mode: "0755"
    remote_src: true
  when: not node_exporter_binary.stat.exists
  notify: Restart node_exporter

- name: Create node_exporter systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network.target

      [Service]
      User=node_exporter
      Group=node_exporter
      Type=simple
      ExecStart=/usr/local/bin/node_exporter \
        --web.listen-address=:{{ node_exporter_port }} \
        --collector.systemd \
        --collector.processes
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: Restart node_exporter

- name: Allow node_exporter port in UFW (monitoring subnet only)
  community.general.ufw:
    rule: allow
    port: "{{ node_exporter_port | string }}"
    proto: tcp
    src: "{{ monitoring_subnet | default('any') }}"
    comment: "Node Exporter — Prometheus scrape"
  when: "'ufw' in ansible_facts.packages or true"

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Verify node_exporter is running
  ansible.builtin.uri:
    url: http://localhost:{{ node_exporter_port }}/metrics
    status_code: 200
  register: ne_check
  retries: 3
  delay: 5
  changed_when: false
