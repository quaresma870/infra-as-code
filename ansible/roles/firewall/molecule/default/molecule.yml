---
# Collections (community.general, ansible.posix, community.docker) are
# installed explicitly by CI before invoking molecule -- no dependency:
# step needed here, which also avoids any ambiguity about what
# requirements-file paths are resolved relative to.

driver:
  name: docker

platforms:
  - name: instance
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2204}-ansible:latest"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    # ufw shells out to iptables, which needs these even inside a
    # privileged container on some kernels/cgroup setups.
    capabilities:
      - NET_ADMIN
      - NET_RAW

provisioner:
  name: ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      instance:
        # ufw_rules has no role-level default (deliberately — it's meant to
        # come from the operator's own inventory, see common/defaults), so
        # it has to be supplied here for the role to apply at all.
        ufw_rules:
          - { port: 22, proto: tcp, rule: allow, comment: "SSH" }
          - { port: 80, proto: tcp, rule: allow, comment: "HTTP" }
        firewall_extra_rules:
          - { port: 8080, proto: tcp, comment: "test extra rule" }

scenario:
  # idempotence excluded deliberately, not overlooked: this role's first
  # real task is `ufw: state: reset`, which always reports changed by
  # design — it's meant to guarantee a clean, fully-deterministic ruleset
  # matching the configured rules exactly on every run, intentionally
  # clearing any rules that crept in outside of Ansible's control. That's
  # correct behaviour for a firewall role, not a bug to "fix" just to
  # satisfy this test — confirmed by actually running the full default
  # sequence including idempotence on real CI and seeing it fail exactly
  # where this reasoning predicts, not assumed up front.
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
