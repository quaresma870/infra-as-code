---
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # TEMP diagnostic: isolate exactly which part of the docker role fails,
    # before falling back to the full role include below.
    - name: DIAG - install deps
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-debian
        state: present

    - name: DIAG - download docker gpg key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: DIAG - map arch
      ansible.builtin.set_fact:
        docker_apt_arch: "{{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"

    - name: DIAG - add docker apt repo via deb822_repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: stable
        architectures: "{{ docker_apt_arch }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
      register: diag_repo_result

    - name: DIAG - show repo result
      ansible.builtin.debug:
        var: diag_repo_result

    - name: DIAG - apt update to confirm the new repo actually works
      ansible.builtin.apt:
        update_cache: true
