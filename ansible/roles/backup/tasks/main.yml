---
# ── Backup role ───────────────────────────────────────────────────────────────
# Copies compose-stacks backup.sh to the server and configures automated cron.

- name: Ensure backup script destination directory exists
  ansible.builtin.file:
    path: "{{ backup_script_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"

- name: Ensure backup destination directory exists
  ansible.builtin.file:
    path: "{{ backup_dest_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"

- name: Clone or update compose-stacks repo (for backup.sh)
  ansible.builtin.git:
    repo: "{{ backup_compose_stacks_repo }}"
    dest: "{{ deploy_home }}/compose-stacks"
    version: main
    update: true
  become_user: "{{ deploy_user }}"
  become: true
  when: backup_use_compose_stacks_script | bool

- name: Copy backup.sh from compose-stacks
  ansible.builtin.copy:
    src: "{{ deploy_home }}/compose-stacks/scripts/backup.sh"
    dest: "{{ backup_script_dir }}/backup.sh"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"
    remote_src: true
  when: backup_use_compose_stacks_script | bool

- name: Deploy backup cleanup script
  ansible.builtin.template:
    src: cleanup.sh.j2
    dest: "{{ backup_script_dir }}/cleanup.sh"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"

- name: Deploy backup wrapper script (runs backup.sh per stack + cleanup)
  ansible.builtin.template:
    src: run_backups.sh.j2
    dest: "{{ backup_script_dir }}/run_backups.sh"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"

- name: Configure daily backup cron job
  ansible.builtin.cron:
    name: "automated-backup"
    user: "{{ deploy_user }}"
    minute: "{{ backup_cron_minute }}"
    hour: "{{ backup_cron_hour }}"
    job: "{{ backup_script_dir }}/run_backups.sh >> {{ backup_dest_dir }}/backup.log 2>&1"
    state: present

- name: Configure log rotation for backup log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/automated-backup
    content: |
      {{ backup_dest_dir }}/backup.log {
        weekly
        rotate 4
        compress
        missingok
        notifempty
      }
    mode: "0644"

- name: Optional — configure remote sync (rsync to offsite host)
  ansible.builtin.cron:
    name: "backup-offsite-sync"
    user: "{{ deploy_user }}"
    minute: "{{ backup_sync_cron_minute }}"
    hour: "{{ backup_sync_cron_hour }}"
    job: >-
      rsync -az --delete {{ backup_dest_dir }}/
      {{ backup_offsite_user }}@{{ backup_offsite_host }}:{{ backup_offsite_path }}/
      >> {{ backup_dest_dir }}/sync.log 2>&1
    state: "{{ 'present' if backup_offsite_enabled | bool else 'absent' }}"
  when: backup_offsite_host is defined and backup_offsite_host | length > 0

- name: Show backup configuration summary
  ansible.builtin.debug:
    msg: >-
      Backups configured: daily at {{ backup_cron_hour }}:{{ backup_cron_minute }},
      destination {{ backup_dest_dir }}, retention {{ backup_keep_daily }} daily /
      {{ backup_keep_weekly }} weekly.
      {{ 'Offsite sync enabled to ' + backup_offsite_host if backup_offsite_enabled | default(false) else 'Offsite sync disabled.' }}
