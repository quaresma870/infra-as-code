---
haproxy_maxconn: 4096
haproxy_stats_enabled: true
haproxy_stats_port: 8404
haproxy_stats_user: admin
haproxy_stats_password: "{{ vault_haproxy_stats_password | default('changeme') }}"
haproxy_stats_allowed_ips: any
haproxy_ssl_enabled: false
haproxy_health_check_path: /health
# Override via playbook — list of {name, address, port}. Empty by default.
haproxy_backend_servers: []
