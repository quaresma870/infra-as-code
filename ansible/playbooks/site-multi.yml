---
# ── Multi-server setup playbook ───────────────────────────────────────────────
# Provisions a load balancer + N app servers sharing a Redis session store.
# Use with inventory/production/hosts-multi.yml.example (copy and adjust IPs).
#
# Usage:
#   ansible-playbook playbooks/site-multi.yml -i inventory/production/hosts-multi.yml
#

- name: Configure all servers (common base)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
      tags: [common, base]
    - role: firewall
      tags: [firewall, security]
    - role: fail2ban
      tags: [fail2ban, security]
    - role: monitoring
      tags: [monitoring]

- name: Configure app servers
  hosts: appservers
  become: true
  gather_facts: true
  roles:
    - role: docker
      tags: [docker]
    - role: nginx
      tags: [nginx, web]
    - role: backup
      tags: [backup]

- name: Configure load balancer
  hosts: loadbalancer
  become: true
  gather_facts: true
  pre_tasks:
    - name: Build backend server list from appservers group
      ansible.builtin.set_fact:
        haproxy_backend_servers: "{{ haproxy_backend_servers | default([]) + [{'name': item, 'address': hostvars[item]['ansible_host'], 'port': 8000}] }}"
      loop: "{{ groups['appservers'] }}"
  roles:
    - role: haproxy
      tags: [haproxy, loadbalancer]

- name: Configure cache servers
  hosts: cache
  become: true
  gather_facts: true
  tasks:
    - name: Install Redis
      ansible.builtin.apt:
        name: redis-server
        state: present

    - name: Configure Redis to listen on private network
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^bind "
        line: "bind 0.0.0.0"
        state: present
      notify: Restart Redis

    - name: Require password authentication
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^# requirepass|^requirepass"
        line: "requirepass {{ vault_redis_password | default('changeme') }}"
        state: present
      notify: Restart Redis

    - name: Allow app servers to reach Redis
      community.general.ufw:
        rule: allow
        port: "6379"
        proto: tcp
        src: "{{ hostvars[item]['ansible_host'] }}"
        comment: "Redis access from {{ item }}"
      loop: "{{ groups['appservers'] }}"

    - name: Enable and start Redis
      ansible.builtin.systemd:
        name: redis-server
        state: started
        enabled: true

  handlers:
    - name: Restart Redis
      ansible.builtin.systemd:
        name: redis-server
        state: restarted

  post_tasks:
    - name: Multi-server setup complete
      ansible.builtin.debug:
        msg: >-
          Multi-server setup complete.
          Load balancer: {{ groups['loadbalancer'] }}
          App servers: {{ groups['appservers'] }}
          Cache: {{ groups['cache'] }}
