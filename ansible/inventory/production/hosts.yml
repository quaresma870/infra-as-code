---
all:
  children:
    webservers:
      hosts:
        web01:
          ansible_host: 1.2.3.4       # replace with your server IP
          ansible_port: 22
          server_name: web01.example.com
      vars:
        env: production

    monitoring:
      hosts:
        mon01:
          ansible_host: 1.2.3.5
          ansible_port: 22

  vars:
    ansible_user: deploy
    ansible_python_interpreter: /usr/bin/python3
