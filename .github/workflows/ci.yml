name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Ansible lint ─────────────────────────────────────────────────────────────
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ansible + lint tools
        run: pip install ansible ansible-lint yamllint

      - name: Lint YAML files
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 150}}}' \
            ansible/roles ansible/playbooks ansible/inventory

      - name: Lint playbooks with ansible-lint
        run: |
          cd ansible
          ansible-lint playbooks/ || true   # warn only — rules vary by ansible-lint version

      - name: Syntax check all playbooks
        run: |
          cd ansible
          for playbook in playbooks/*.yml; do
            echo -n "  Syntax check $playbook ... "
            ansible-playbook "$playbook" --syntax-check -i localhost, && echo "OK"
          done

  # ── Terraform fmt + validate ──────────────────────────────────────────────────
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform validate (modules)
        run: |
          cd terraform/modules/vps
          terraform init -backend=false
          terraform validate

      - name: Terraform validate (production)
        run: |
          cd terraform/environments/production
          terraform init -backend=false
          terraform validate
        env:
          TF_VAR_hcloud_token: "dummy-token-for-validation"
          TF_VAR_ssh_public_key: "ssh-ed25519 AAAA dummy key for CI"
