name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Ansible lint ─────────────────────────────────────────────────────────────
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Ansible and lint tools
        run: pip install -r requirements.txt

      - name: Install required Ansible collections
        run: |
          ansible-galaxy collection install \
            community.general \
            ansible.posix

      - name: Lint YAML files
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 150}}}' \
            ansible/roles ansible/playbooks ansible/inventory

      - name: Syntax check all playbooks
        run: |
          cd ansible
          for playbook in playbooks/*.yml; do
            echo -n "  Syntax check $playbook ... "
            ansible-playbook "$playbook" --syntax-check -i localhost, && echo "OK"
          done

      - name: Run ansible-lint
        run: |
          cd ansible
          ansible-lint playbooks/ --profile=basic
          # playbooks/ doesn't transitively pull in roles/*/molecule/ the
          # way it does each role's tasks/defaults/etc, so this needs its
          # own explicit invocation to actually get linted in CI.
          ansible-lint roles/*/molecule --profile=basic

  # ── Molecule (role testing) ─────────────────────────────────────────────────
  molecule:
    name: Molecule (${{ matrix.role }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Sequential, not parallel: running all 3 simultaneously caused
      # intermittent fast failures that individual/sequential runs of the
      # exact same jobs did not — consistent with concurrent anonymous
      # Docker Hub pulls of the same geerlingguy image hitting a rate
      # limit, confirmed by testing each role alone (always passes) vs.
      # all three together (docker/ssl failed, firewall did not, no
      # consistent pattern pointing at any one role's own config).
      max-parallel: 1
      matrix:
        role: [firewall, docker, ssl]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Ansible, Molecule, and the Docker driver
        run: pip install -r requirements.txt

      - name: Install required Ansible collections
        run: |
          ansible-galaxy collection install \
            community.general \
            ansible.posix \
            community.docker

      - name: molecule test
        run: |
          cd ansible/roles/${{ matrix.role }}
          molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          # ansible/ansible.cfg's roles_path is only auto-discovered when
          # ansible runs FROM ansible/ itself — it does not search parent
          # directories, and `cd ansible/roles/${{ matrix.role }}` above
          # means ansible.cfg is never found at all from here. Set this
          # explicitly so `include_role: name: ${{ matrix.role }}` in
          # converge.yml resolves correctly regardless of Molecule's own
          # role-path auto-detection (nested-in-a-role-directory) actually
          # kicking in or not.
          ANSIBLE_ROLES_PATH: "${{ github.workspace }}/ansible/roles"

  # ── Terraform ────────────────────────────────────────────────────────────────
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform fmt check
        run: |
          terraform fmt -check -recursive terraform/ || {
            echo ""
            echo "Run 'terraform fmt -recursive terraform/' locally to fix formatting."
            exit 1
          }

      - name: Terraform validate — vps module
        run: |
          cd terraform/modules/vps
          terraform init -backend=false -input=false
          terraform validate

      - name: Terraform validate — production environment
        run: |
          cd terraform/environments/production
          terraform init -backend=false -input=false
          terraform validate
        env:
          TF_VAR_hcloud_token: "dummy-for-ci-validation-only"
          TF_VAR_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIdummy key for CI validation"

      - name: Terraform validate — staging environment
        run: |
          cd terraform/environments/staging
          terraform init -backend=false -input=false
          terraform validate
        env:
          TF_VAR_hcloud_token: "dummy-for-ci-validation-only"
          TF_VAR_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIdummy key for CI validation"
# retry to check determinism vs flakiness
